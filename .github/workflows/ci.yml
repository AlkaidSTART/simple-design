name: CI and auto merge dev

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: glassstudio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  merge-dev:
    name: Merge dev into main
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Merge dev into main
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: 'main',
              head: 'dev',
            });

            if (comparison.data.ahead_by === 0) {
              core.info('main already contains dev; nothing to merge.');
              return;
            }

            if (comparison.data.status === 'behind') {
              core.setFailed('Cannot promote dev to main: dev is behind main.');
              return;
            }

            let merge;
            try {
              merge = await github.rest.repos.merge({
                owner,
                repo,
                base: 'main',
                head: 'dev',
                commit_message: 'chore: promote dev to main',
              });
            } catch (error) {
              if (error.status !== 409 || comparison.data.status !== 'diverged') {
                throw error;
              }

              // The repository was previously squash-merged, so the branches
              // can have equivalent content but unrelated commit ancestry.
              // Preserve both histories and use the tested dev tree as the
              // resolved result for this promotion.
              const [mainCommit, devCommit] = await Promise.all([
                github.rest.repos.getCommit({ owner, repo, ref: 'main' }),
                github.rest.repos.getCommit({ owner, repo, ref: 'dev' }),
              ]);
              const mergeCommit = await github.rest.git.createCommit({
                owner,
                repo,
                message: 'chore: promote dev to main',
                tree: devCommit.data.commit.tree.sha,
                parents: [mainCommit.data.sha, devCommit.data.sha],
              });
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'heads/main',
                sha: mergeCommit.data.sha,
                force: false,
              });
              core.info(`Created a promotion merge commit at ${mergeCommit.data.sha}.`);
              return;
            }

            core.info(`Merged dev into main at ${merge.data.sha}.`);
