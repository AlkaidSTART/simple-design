name: CI and auto merge dev

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: glassstudio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  merge-dev:
    name: Merge dev into main
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Create and merge main PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:dev`;
            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              head,
            });
            const pull = existing[0] ?? await github.rest.pulls.create({
              owner,
              repo,
              head: 'dev',
              base: 'main',
              title: 'chore: promote dev to main',
              body: 'Automated promotion from `dev` after the CI quality gate passed.',
            }).then((response) => response.data);
            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              merge_method: 'squash',
              commit_title: `chore: promote dev to main (#${pull.number})`,
            });
            if (!merge.data.merged) {
              core.setFailed(`Could not merge PR #${pull.number}: ${merge.data.message}`);
            } else {
              core.info(`Merged PR #${pull.number} into main.`);
            }
